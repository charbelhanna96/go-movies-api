services:
  postgres:
    build:
      context: ./db-migrations
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "--dbname=movie"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: movie
      POSTGRES_USER: postgres
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_SHUTDOWN_TIMEOUT_SEC: "15"
      LOG_LEVEL: "info"
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: "movie"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "password123"
      DATABASE_MAX_OPEN_CONNS: "25"
      DATABASE_MAX_IDLE_CONNS: "5"
      DATABASE_CONN_MAX_LIFETIME_MIN: "5"
      DATABASE_CONN_MAX_IDLE_TIME_MIN: "1"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8081"
      HTTP_READ_TIMEOUT_SEC: "10"
      HTTP_WRITE_TIMEOUT_SEC: "10"
      HTTP_IDLE_TIMEOUT_SEC: "60"
      HEALTH_HANDLER_TIMEOUT_SEC: "2"
      MOVIES_HANDLER_TIMEOUT_SEC: "5"
      OTEL_ENDPOINT: "jaeger:4318"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      kafka:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi.yaml

  jaeger:
      image: jaegertracing/all-in-one:latest
      ports:
        - "16686:16686"   # Jaeger UI
        - "4318:4318"     # OTLP HTTP receiver
      environment:
        COLLECTOR_OTLP_ENABLED: "true"

  kafka:
      image: apache/kafka:3.9.0
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 0
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      healthcheck:
        test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 15s
